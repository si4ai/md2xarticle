[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "md2xarticle"
dynamic = ["version"]
description = "Markdown in, X Article out: polished, centered diagram images and paste-ready articles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Pillow 13.0.0 ships wheels for 3.11 and later only, so 3.10 is out.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
# The renderer stack is pinned so PNG output is byte-identical on one platform.
dependencies = [
    "mermaidx==0.11.3",
    "novasvg==0.11.5",
    "quickjs-ng==0.18.0.1",
    "Pillow==13.0.0",
    "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
md2xarticle = "md2xarticle.cli:main"

[project.urls]
Homepage = "https://github.com/si4ai/md2xarticle"
Source = "https://github.com/si4ai/md2xarticle"
Issues = "https://github.com/si4ai/md2xarticle/issues"

[tool.hatch.version]
path = "src/md2xarticle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/md2xarticle"]

[tool.hatch.build.targets.sdist]
include = ["src/md2xarticle", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
