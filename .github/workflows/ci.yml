name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove the scanner fails visibly
        run: python3 tools/hygiene.py --selftest
      - name: Scan the tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          extra=()
          if [ -n "${base:-}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            extra=(--base "$base" --head "$head")
          fi
          python3 tools/hygiene.py "${extra[@]}"

  role_trailer_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          if ! git cat-file -e "${base:-missing}^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet "$head^1" || true)
            echo "no usable base for this event; scanning the last commit against its first parent."
          fi
          if [ -z "$base" ]; then
            echo "root commit, nothing to compare: no role-trailer report."
            exit 0
          fi
          python3 tools/role_trailer.py --base "$base" --head "$head"
