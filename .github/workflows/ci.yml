name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove the scanner fails visibly
        run: python3 tools/hygiene.py --selftest
      - name: Scan the tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          extra=()
          if [ -n "${base:-}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            extra=(--base "$base" --head "$head")
          fi
          python3 tools/hygiene.py "${extra[@]}"

  role_trailer_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          if ! git cat-file -e "${base:-missing}^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet "$head^1" || true)
            echo "no usable base for this event; scanning the last commit against its first parent."
          fi
          if [ -z "$base" ]; then
            echo "root commit, nothing to compare: no role-trailer report."
            exit 0
          fi
          python3 tools/role_trailer.py --base "$base" --head "$head"

  # Supported Python range (3.11+) on ubuntu; 3.12 only on macOS and Windows, to keep
  # private-repo Actions minutes reasonable until package code lands.
  # When pyproject.toml and src/md2xarticle are both absent, each cell
  # succeeds with a notice and does not install, test, or build.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Package present?
        id: pkg
        run: |
          if [ -f pyproject.toml ] && [ -d src/md2xarticle ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pyproject.toml / src/md2xarticle yet; skipping tests and the wheel build until package code lands."
          fi
      - name: Install test and build tools
        if: steps.pkg.outputs.present == 'true'
        run: |
          python -m pip install pytest==9.2.0 build==1.6.1 twine==7.0.0
          python -m pip install .
      - name: Run pytest
        if: steps.pkg.outputs.present == 'true'
        run: pytest
      - name: Build sdist and wheel
        if: steps.pkg.outputs.present == 'true'
        run: |
          python -m build --outdir dist .
          python -m twine check --strict dist/*
      - name: Smoke test the wheel
        if: steps.pkg.outputs.present == 'true'
        run: |
          set -eu
          python -m venv "${RUNNER_TEMP}/smoke"
          if [ -x "${RUNNER_TEMP}/smoke/bin/python" ]; then
            PY="${RUNNER_TEMP}/smoke/bin/python"
            CLI="${RUNNER_TEMP}/smoke/bin/md2xarticle"
          else
            PY="${RUNNER_TEMP}/smoke/Scripts/python.exe"
            CLI="${RUNNER_TEMP}/smoke/Scripts/md2xarticle.exe"
          fi
          wheel=$(ls dist/*.whl)
          "$PY" -m pip install "$wheel"
          cd "${RUNNER_TEMP}"
          "$CLI" --help
