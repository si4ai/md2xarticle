name: Tests

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is out: Pillow 13.0.0 has no wheels for it.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --only-binary mermaidx,novasvg,quickjs-ng,Pillow -e ".[test]"
      - name: Test
        run: python -m pytest -q

  package:
    # Build once per OS on the oldest supported Python: the pytest matrix
    # already covers every version, and 3.11 is the floor most likely to break.
    name: package (${{ matrix.os }}, 3.11)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build -o dist .
      - name: Check, scan, install, and convert each artifact
        run: python tests/dist_check.py dist

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned version and checksum)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
      - name: Lint workflows
        run: ./actionlint -color

  offline:
    # The conversion with networking cut by the kernel, not by a Python patch:
    # catches native code or subprocesses that a socket monkeypatch can't see.
    name: offline (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install (network allowed here)
        run: python -m pip install --only-binary mermaidx,novasvg,quickjs-ng,Pillow .
      - name: Control - the probes reach the network outside the namespace
        run: python tests/offline_run.py online-control
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict them through AppArmor by default.
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn true
      - name: Prove no network, then convert, inside unshare -rn
        run: |
          mkdir -p "$RUNNER_TEMP/offline"
          unshare -rn python tests/offline_run.py offline-convert "$RUNNER_TEMP/offline/out"
