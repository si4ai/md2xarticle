# PyPI release. Trusted publishing (OIDC): no stored token.
# The PyPI publisher is bound to this file name (release.yml) and the
# environment name (pypi); renaming either breaks publishing.
#   workflow_dispatch from main -> build, tests, twine check, wheel smoke
#     (dry run, publishes nothing)
#   push of a v* tag -> the same checks, then publish to PyPI (environment: pypi)
name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package metadata is present
        run: |
          set -eu
          if [ ! -f pyproject.toml ]; then
            echo "release requires pyproject.toml; no package to publish yet."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A v* tag off main must not publish.
      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG_SHA" origin/main
      # Only main may be dispatched, so the dry run matches what a tag would ship.
      - name: workflow dispatch is from main
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          test "${GITHUB_REF}" = "refs/heads/main"
      - name: Install build tools
        run: python -m pip install build==1.6.1 twine==7.0.0 pytest==9.2.0
      - name: Tests
        run: |
          python -m pip install --only-binary mermaidx,novasvg,quickjs-ng,Pillow .
          pytest
      - name: Build sdist and wheel
        run: python -m build --outdir dist .
      - name: Tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          python3 - <<'PY'
          import email, os, sys, zipfile
          from pathlib import Path

          tag = os.environ["REF_NAME"]
          want = tag.removeprefix("v")
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected 1 wheel and 1 sdist, got {wheels} {sdists}")
          with zipfile.ZipFile(wheels[0]) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              meta = email.parser.Parser().parsestr(zf.read(name).decode())
          version = meta["Version"]
          if version != want:
              sys.exit(
                  f"tag {tag} does not match the built package version {version} "
                  f"(from pyproject). Fix the tag or bump the version in "
                  f"src/md2xarticle/__init__.py, then try again."
              )
          print(f"tag {tag} matches package version {version}")
          PY
      - run: python -m twine check --strict dist/*
      # The installed wheel must run with no checkout on the path.
      - name: Smoke test the wheel
        run: |
          set -eu
          python -m venv /tmp/md2xarticle-smoke
          /tmp/md2xarticle-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/md2xarticle-smoke/bin/md2xarticle --help
      # Dry run uploads nothing. The dist artifact is kept only for a tag publish.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish_pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/md2xarticle/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The composite action pulls ghcr.io/pypa/gh-action-pypi-publish:<action-sha>,
      # a mutable registry tag. Refuse unless its digest matches the pin on the
      # uses line; bump ACTION_SHA, WANT_DIGEST and the uses pin together.
      - name: Publish image digest matches pin
        env:
          ACTION_SHA: "7245906fb61fa33a13554f9d5fb856fe61758086"
          WANT_DIGEST: "sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc"
        run: |
          set -eu
          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:pypa/gh-action-pypi-publish:pull" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          got=$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/pypa/gh-action-pypi-publish/manifests/${ACTION_SHA}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2; exit}')
          test -n "$got"
          test "$got" = "$WANT_DIGEST"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 image sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc
